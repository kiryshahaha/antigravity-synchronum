<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synchronum Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0f172a',
            surface: '#1e293b',
            border: '#334155',
            accent: '#38bdf8',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col gap-4">

  <!-- Header -->
  <header class="flex items-center justify-between border-b border-slate-800 pb-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold">
        🔄
      </div>
      <div>
        <h1 class="text-sm font-semibold text-slate-100">Synchronum</h1>
        <p class="text-xs text-slate-400">Google Antigravity 2.0 Sync</p>
      </div>
    </div>
    <div id="status-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Connected</span>
    </div>
  </header>

  <!-- Google Drive Card -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-base">☁️</span>
        <span class="text-xs font-medium text-slate-200">Google Drive (appDataFolder)</span>
      </div>
      <span id="gdrive-status" class="text-xs text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/20">Pro Quota (5 TB)</span>
    </div>
    
    <div class="flex items-center gap-2">
      <input type="password" id="master-password" placeholder="Enter E2EE Master Password" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 w-full focus:outline-none focus:border-sky-500 placeholder-slate-600" />
      <button onclick="toggleLock()" id="btn-lock" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700 transition">
        🔒 Set Key
      </button>
    </div>

    <div class="flex gap-2">
      <button onclick="triggerPull()" class="flex-1 bg-sky-600 hover:bg-sky-500 text-white py-1.5 px-3 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5">
        <span>⬇️</span> Pull Cloud
      </button>
      <button onclick="triggerSyncAll()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg text-xs font-medium border border-slate-700 transition flex items-center justify-center gap-1.5">
        <span>🔄</span> Full Sync
      </button>
    </div>
  </section>

  <!-- Path Mapping Settings -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <span class="text-xs font-medium text-slate-300">🖥️ Path Translation (OS Remap)</span>
      <span class="text-[10px] text-slate-500 uppercase tracking-wider font-mono">Auto Git Remote</span>
    </div>
    <div class="text-[11px] text-slate-400 bg-slate-950 p-2 rounded border border-slate-800/80 font-mono">
      <div class="text-slate-500">Local Workspaces:</div>
      <div class="text-emerald-400 truncate">C:\Users\Кирилл\Desktop\synchronum</div>
    </div>
  </section>

  <!-- Conversations List -->
  <section class="flex-1 flex flex-col gap-2 min-h-0">
    <div class="flex items-center justify-between text-xs text-slate-400 px-1">
      <span>Local Sessions (<span id="session-count">--</span>)</span>
      <button onclick="loadSessions()" class="hover:text-sky-400 transition text-[11px]">↻ Refresh</button>
    </div>

    <div id="sessions-list" class="flex-1 overflow-y-auto flex flex-col gap-2 pr-1">
      <div class="text-xs text-slate-500 text-center py-6">Loading conversations...</div>
    </div>
  </section>

  <script>
    async function loadSessions() {
      try {
        const res = await fetch('/api/conversations');
        const data = await res.json();
        const container = document.getElementById('sessions-list');
        document.getElementById('session-count').innerText = data.length;

        if (data.length === 0) {
          container.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">No conversations found.</div>';
          return;
        }

        container.innerHTML = data.map(s => `
          <div class="bg-slate-900/90 hover:bg-slate-800/80 border border-slate-800/80 rounded-lg p-2.5 flex flex-col gap-1.5 transition">
            <div class="flex items-start justify-between gap-2">
              <span class="text-xs font-medium text-slate-200 line-clamp-1">${s.title || '(Untitled conversation)'}</span>
              <span class="text-[10px] text-sky-400 font-mono bg-sky-500/10 px-1.5 py-0.5 rounded">${s.step_count} steps</span>
            </div>
            <div class="flex items-center justify-between text-[10px] text-slate-500">
              <span class="truncate max-w-[150px] font-mono">${s.conversation_id}</span>
              <div class="flex gap-1.5">
                <button onclick="exportConvo('${s.conversation_id}')" class="hover:text-slate-200 transition">📦 Export</button>
                <button onclick="pushConvo('${s.conversation_id}')" class="text-sky-400 hover:text-sky-300 font-medium transition">☁️ Push</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('sessions-list').innerHTML = '<div class="text-xs text-rose-400 text-center py-6">Failed to load sessions.</div>';
      }
    }

    function toggleLock() {
      const pwd = document.getElementById('master-password').value;
      if (!pwd) {
        alert('Please enter a password');
        return;
      }
      alert('Master password saved in session memory for E2EE encryption!');
    }

    function triggerPull() {
      alert('Pulling latest sessions from Google Drive...');
    }

    function triggerSyncAll() {
      alert('Running full bi-directional synchronization...');
    }

    function exportConvo(id) {
      window.open('/api/export/' + id);
    }

    function pushConvo(id) {
      alert('Uploading session ' + id + ' to Google Drive appDataFolder...');
    }

    loadSessions();
  </script>
</body>
</html>
