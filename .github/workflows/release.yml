name: Release & Binary Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-bundles:
    name: Build Portable Bundles & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build & Tests
        run: |
          npm run build
          npm test

      - name: Generate Release Bundles
        run: npm run bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Synchronum ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/synchronum-*-portable.zip
            install.bat
            install.sh
